{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        h1 {
            text-align: center;
            color: #e91e63;
            margin: 20px 0;
        }
        .search-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product-card {
            background: #fff3f3;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
        }
        .product-card h3 {
            margin: 10px 0 5px;
        }
    </style>
</head>
<body>


    <div class="search-results">
            {% for product in products %}
                <div class="product-card">
                    
                    <a href="{% url 'product_detail' product.pk %}">
                             <img src="{{ product.image }}" alt="{{ product.name }}">
                        <h3>{{ product.name }}</h3>
                        <p>₹{{ product.price }}</p>
                    </a>
                </div>
            {% endfor %}
            {% if not products %}
            <p style="text-align:center; width:100%;">No products found.</p>
            {% endif %}

    </div>
</body>
</html>
